<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GoalSaga Hub · 入口</title>
  <style>
    :root {
      --bg: oklch(14% 0.03 252);
      --surface: oklch(19% 0.026 248);
      --fg: oklch(96% 0.01 110);
      --muted: oklch(74% 0.018 240);
      --border: oklch(30% 0.024 246);
      --accent: oklch(80% 0.22 145);
      --font-display: 'Arial Black', 'Segoe UI', 'Helvetica Neue', system-ui, sans-serif;
      --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(180deg, color-mix(in oklch, var(--bg) 88%, black), var(--bg));
      color: var(--fg);
      font-family: var(--font-body);
      padding: 24px;
    }
    .panel {
      width: min(720px, 100%);
      padding: 32px;
      border-radius: 24px;
      border: 1px solid var(--border);
      background: linear-gradient(180deg, color-mix(in oklch, var(--surface) 90%, transparent), color-mix(in oklch, var(--bg) 16%, black));
      box-shadow: 0 24px 60px color-mix(in oklch, var(--bg) 70%, black);
    }
    h1 {
      margin: 0 0 16px;
      font-family: var(--font-display);
      font-size: clamp(34px, 7vw, 56px);
      line-height: 0.98;
      letter-spacing: -0.03em;
      text-transform: uppercase;
    }
    p { margin: 0 0 24px; color: var(--muted); line-height: 1.6; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 13px 20px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 700;
      transition: transform 0.14s ease, background 0.18s ease;
    }
    .btn-primary {
      background: var(--accent);
      color: color-mix(in oklch, var(--bg) 78%, black);
    }
    .btn-primary:hover { transform: translateY(-2px); background: color-mix(in oklch, var(--accent) 88%, white); }
    .btn-secondary {
      border: 1px solid var(--border);
      color: var(--fg);
      background: color-mix(in oklch, var(--surface) 82%, transparent);
    }
    .btn-secondary:hover { transform: translateY(-2px); }
  </style>
</head>
<body>
  <main class="panel" data-od-id="entry-panel">
    <h1 data-od-id="entry-title">GoalSaga Hub 首页原型</h1>
    <p data-od-id="entry-copy">这里是本次首页方向稿入口。主文件是 `landing.html`，包含响应式首页、关键组件状态，以及颜色 / 字体 / 间距规范说明。</p>
    <div class="actions" data-od-id="entry-actions">
      <a class="btn btn-primary" href="landing.html">打开首页设计</a>
      <a class="btn btn-secondary" href="landing.html#design-specs">查看规范说明</a>
    </div>
  </main>
</body>
</html>
