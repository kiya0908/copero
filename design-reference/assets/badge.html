<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>copero 徽章</title>
  <style>
    :root {
      --bg: oklch(14% 0.03 252);
      --surface: oklch(19% 0.026 248);
      --fg: oklch(96% 0.01 110);
      --border: oklch(30% 0.024 246);
      --accent: oklch(80% 0.22 145);
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
    }
    .badge {
      width: 160px;
      height: 160px;
      border-radius: 40px;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, color-mix(in oklch, var(--surface) 78%, var(--accent) 22%), color-mix(in oklch, var(--surface) 86%, black));
      border: 1px solid color-mix(in oklch, var(--accent) 34%, var(--border));
      box-shadow: 0 12px 28px color-mix(in oklch, var(--accent) 22%, transparent);
      color: var(--fg);
    }
    svg { width: 84px; height: 84px; }
  </style>
</head>
<body>
  <div class="badge">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-label="copero badge">
      <path d="M12 3l6 4v10l-6 4-6-4V7l6-4Z"></path>
      <path d="M9 10.5l3-2 3 2v3l-3 2-3-2v-3Z"></path>
    </svg>
  </div>
</body>
</html>
