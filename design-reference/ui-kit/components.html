<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>核心组件</title>
  <link rel="stylesheet" href="../../colors_and_type.css" />
  <style>
    body { padding: 32px; }
    .wrap { max-width: 1180px; margin: 0 auto; display: grid; gap: 24px; }
    .panel { padding: 24px; border-radius: 24px; border: 1px solid var(--border); background: color-mix(in oklch, var(--surface) 90%, transparent); box-shadow: var(--shadow-soft); }
    .nav { display: flex; justify-content: space-between; gap: 20px; align-items: center; flex-wrap: wrap; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .badge { width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; background: linear-gradient(145deg, color-mix(in oklch, var(--surface) 78%, var(--accent) 22%), color-mix(in oklch, var(--surface) 86%, black)); border: 1px solid color-mix(in oklch, var(--accent) 34%, var(--border)); }
    .logo { font-family: var(--font-display); text-transform: uppercase; font-size: 20px; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .btn { display: inline-flex; align-items: center; justify-content: center; padding: 13px 22px; border-radius: 999px; font-weight: 700; border: 1px solid transparent; }
    .btn-primary { background: var(--accent); color: color-mix(in oklch, var(--bg) 78%, black); }
    .btn-secondary { border-color: var(--border); background: color-mix(in oklch, var(--surface) 86%, transparent); }
    .switcher { display: inline-flex; gap: 6px; padding: 6px; background: color-mix(in oklch, var(--surface) 80%, transparent); border-radius: 999px; border: 1px solid var(--border); }
    .chip { min-width: 48px; padding: 8px 10px; border-radius: 999px; text-align: center; font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
    .chip.active { background: var(--fg); color: var(--bg); }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px; }
    .card { padding: 24px; border-radius: 24px; border: 1px solid var(--border); background: linear-gradient(180deg, color-mix(in oklch, var(--surface) 92%, transparent), color-mix(in oklch, var(--bg) 24%, black)); }
    .result { padding: 26px; border-radius: 32px; border: 1px solid color-mix(in oklch, var(--gold) 20%, var(--border)); background: radial-gradient(circle at top right, color-mix(in oklch, var(--gold) 24%, transparent), transparent 36%), linear-gradient(180deg, color-mix(in oklch, var(--surface) 76%, black), color-mix(in oklch, var(--bg) 78%, black)); }
  </style>
</head>
<body>
  <main class="wrap" data-od-id="components-page">
    <section class="panel nav" data-od-id="components-nav">
      <div class="brand"><div class="badge"><img src="../../assets/wordmark.svg" alt="copero 标志" style="width: 22px; height: 22px; object-fit: contain;" /></div><span class="logo">copero hub</span></div>
      <div class="row"><div class="switcher"><span class="chip active">ES</span><span class="chip">PT-BR</span><span class="chip">IT</span><span class="chip">EN</span></div><button class="btn btn-primary">去官方免费玩</button></div>
    </section>
    <section class="grid" data-od-id="components-grid">
      <article class="card"><span class="eyebrow">Buttons</span><h3>CTA 体系</h3><div class="row" style="margin-top: 16px;"><button class="btn btn-primary">立即去官方免费玩</button><button class="btn btn-secondary">查看攻略</button></div></article>
      <article class="card"><span class="eyebrow">Tags</span><h3>标签信号</h3><p style="color: var(--muted);">免费浏览器游戏 · 结果卡可分享 · 无需下载</p></article>
      <article class="result"><p class="eyebrow" style="color: var(--gold);">Legend Route · RW #7</p><h2 style="font-size: clamp(52px, 8vw, 92px);">07</h2><p style="margin: 0; color: var(--muted);">边锋怪物 · Mateo Cruz</p><p style="margin-top: 10px;">92 Overall · 31 G/A</p></article>
    </section>
  </main>
</body>
</html>
