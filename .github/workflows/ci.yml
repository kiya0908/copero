name: CI

on:
  push:
    branches:
      - main
      - feat/**
      - fix/**
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Validate launch configuration
        run: npm run validate:launch
      - name: Validate i18n architecture
        run: node scripts/validate-i18n.mjs
      - name: Smoke test complete game flow
        run: npm run smoke:flow
      - name: Build and prerender
        run: npm run build
      - name: Validate localized SEO output
        run: npm run validate:seo
      - name: Validate release readiness
        run: npm run validate:release
